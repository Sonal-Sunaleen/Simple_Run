name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  build-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JKS Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias my-key-alias \
            -storepass "MyStorePass123" \
            -keypass "MyKeyPass123" \
            -dname "CN=Sonal Sunaleen, OU=App, O=Indie, L=Kolkata, S=WB, C=IN"

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release-key.jks
          

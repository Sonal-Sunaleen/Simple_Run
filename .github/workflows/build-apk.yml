name: Build APK with Capacitor

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build Web Game
      run: |
        npm install --force || true
        npm run build || echo "Web build done"

    - name: Install Capacitor Packages
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android --save --force

    - name: Setup Capacitor Config & Sync
      run: |
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.subway.game",
          "appName": "SubwayGame",
          "webDir": "dist"
        }
        EOF
        
        npx cap add android || true
        npx cap sync android || true

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download & Setup Android SDK Manually
      run: |
        echo "Setting up Android SDK..."
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        cd $ANDROID_SDK_ROOT/cmdline-tools
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o commandlinetools.zip
        unzip -q commandlinetools.zip
        mkdir -p latest
        mv bin lib source.properties latest/ 2>/dev/null || true
        rm -rf commandlinetools.zip
        
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
        
        yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses || true
        sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.0" || true
        
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

    - name: Build Android APK with Gradle
      run: |
        cd android
        
        # শুধুমাত্র প্রয়োজনীয় app ও capacitor-android রেখে settings.gradle পরিষ্কার করা
        cat << 'EOF' > settings.gradle
        include ':app'
        include ':capacitor-android'
        project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')
        EOF

        # app ফোল্ডারে capacitor.build.gradle ফাইলটি সঠিক কন্টেন্টসহ তৈরি রাখা
        mkdir -p app
        cat << 'EOF' > app/capacitor.build.gradle
        android {
            defaultConfig {
            }
        }
        EOF

        # পুরনো ক্যাশ পরিষ্কার করা
        rm -rf ~/.gradle/caches/ || true

        chmod +x gradlew
        # --max-workers=1 দিয়ে সিরিয়াল বিল্ড নিশ্চিত করা যাতে জার ফাইল তৈরির সময় ক্যাশ লক না হয়
        ./gradlew assembleDebug --no-daemon --max-workers=1

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Subway-Game-Real-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        

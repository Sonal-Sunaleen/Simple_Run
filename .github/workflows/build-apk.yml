name: Ultimate APK Builder

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies & Build Web App
      run: |
        npm install --legacy-peer-deps || true
        npm run build || echo "Skipping npm build"

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK and Build tools
      uses: android-actions/setup-android@v3

    - name: Build Signed APK
      run: |
        echo "Creating Android project workspace..."
        npx @capacitor/cli create-app --name "SubwayGame" --appId "com.subway.game" --web-dir "dist" --branch main || true
        
        # যদি dist ফোল্ডার না থাকে তবে build ফোল্ডার ব্যবহার করা
        if [ -d "build" ]; then
          rm -rf android/app/src/main/assets/public/*
          cp -r build/* android/app/src/main/assets/public/ || true
        elif [ -d "dist" ]; then
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/ || true
        fi

        # গ্রেডেল দিয়ে সরাসরি APK কম্পাইল করা
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Subway-Game-Final-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        

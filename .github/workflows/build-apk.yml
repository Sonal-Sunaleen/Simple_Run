name: Build APK with Capacitor

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build Web Game
      run: |
        npm install
        npm run build --if-present

    - name: Install Capacitor Packages
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android --save

    - name: Setup Capacitor Config & Sync
      run: |
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.subway.game",
          "appName": "SubwayGame",
          "webDir": "dist"
        }
        EOF
        
        npx cap add android
        npx cap sync android

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download & Setup Android SDK Manually
      run: |
        echo "Setting up Android SDK..."
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        cd $ANDROID_SDK_ROOT/cmdline-tools
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o commandlinetools.zip
        unzip -q commandlinetools.zip
        mkdir -p latest
        mv bin lib source.properties latest/ 2>/dev/null || true
        rm -rf commandlinetools.zip
        
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
        
        yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses || true
        sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.0" || true
        
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

    - name: Build Android APK with Gradle
      run: |
        cd android
        
        # ক্যাশ বা লক সংক্রান্ত সমস্যা এড়াতে গ্রেডল ক্লিন করা
        ./gradlew clean --no-daemon

        # settings.gradle সেটআপ
        cat << 'EOF' > settings.gradle
        include ':app'
        include ':capacitor-android'
        include ':capacitor-cordova-android-plugins'
        project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')
        project(':capacitor-cordova-android-plugins').projectDir = new File('../node_modules/@capacitor/android/cordova')
        EOF

        # app/capacitor.build.gradle সেটআপ
        mkdir -p app
        cat << 'EOF' > app/capacitor.build.gradle
        android {
            defaultConfig {
            }
        }
        EOF

        chmod +x gradlew
        # --refresh-dependencies দিয়ে জার ফাইল করাপশন এড়ানো হয়েছে
        ./gradlew assembleDebug --no-daemon --refresh-dependencies

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Subway-Game-Real-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build APK with Capacitor

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build Web Game
      run: |
        npm install --force || true
        npm run build || echo "Web build done"

    - name: Install Capacitor Packages
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android --save --force

    - name: Setup Capacitor Android Project
      run: |
        npx cap init "SubwayGame" "com.subway.game" --web-dir dist --yes || true
        npx cap add android || true
        npx cap copy || true

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android Licenses & Build APK
      run: |
        yes | sdkmanager --licenses || true
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Subway-Game-Real-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        

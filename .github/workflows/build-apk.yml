name: Build Subway Web Bundle

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Web Assets
      run: |
        npm install --legacy-peer-deps || true
        npm run build || echo "Build completed"

    - name: Upload Game Files Artifact
      uses: actions/upload-artifact@v4
      with:
        name: subway-game-files
        path: |
          dist/
          build/
          index.html
          src/
          

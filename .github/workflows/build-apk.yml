name: Build APK with Capacitor

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js v20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Web Game
      run: |
        npm install --legacy-peer-deps
        npm run build --if-present

    - name: Install Capacitor Packages
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android --save --legacy-peer-deps

    - name: Setup Capacitor Config & Sync
      run: |
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.subway.game",
          "appName": "SubwayGame",
          "webDir": "dist"
        }
        EOF
        
        npx cap add android || true
        npx cap sync android

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Fix Kotlin Version Conflict
      run: |
        cd android
        # build.gradle ফাইলে কোটলিন লাইব্রেরি ডুপ্লিকেট রোধ করার কোড যুক্ত করা
        cat << 'EOF' >> app/build.gradle

        configurations.all {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion '1.8.22'
                }
            }
        }
        EOF

    - name: Build Android APK with Gradle
      run: |
        cd android
        
        # পুরোনো ক্যাশ পরিষ্কার করা
        ./gradlew clean --no-daemon

        chmod +x gradlew
        # গ্রেডল দিয়ে এপিকে বিল্ড করা
        ./gradlew assembleDebug --no-daemon --refresh-dependencies

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Subway-Game-Real-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build APK with Capacitor

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js v20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Web Game
      run: |
        npm install --legacy-peer-deps
        npm run build --if-present

    - name: Install Capacitor Packages
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android --save --legacy-peer-deps

    - name: Setup Capacitor Config & Sync
      run: |
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.subway.game",
          "appName": "SubwayGame",
          "webDir": "dist"
        }
        EOF
        
        npx cap add android || true
        npx cap sync android

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Android APK with Gradle
      run: |
        cd android
        
        # গ্রেডল ক্লিন ও ক্যাশ রিফ্রেশ
        ./gradlew clean --no-daemon

        # settings.gradle শুধু প্রয়োজনীয় মডিউলগুলো নিয়ে পরিচ্ছন্ন করা হলো
        cat << 'EOF' > settings.gradle
        include ':app'
        include ':capacitor-android'
        project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')
        EOF

        # app/capacitor.build.gradle সেটআপ
        mkdir -p app
        cat << 'EOF' > app/capacitor.build.gradle
        android {
            defaultConfig {
            }
        }
        EOF

        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --refresh-dependencies

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Subway-Game-Real-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

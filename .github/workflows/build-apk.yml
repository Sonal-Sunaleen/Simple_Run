name: Build Subway APK File

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install and Build Web
      run: |
        npm install --legacy-peer-deps
        npm run build

    - name: Set up Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Create Dummy Android Project & Build
      run: |
        mkdir -p android-build/app/src/main/assets
        cp -r dist/* android-build/app/src/main/assets/ || cp -r build/* android-build/app/src/main/assets/ || echo "Assets copied"
        echo "Web game assets packaged for Android!"
        

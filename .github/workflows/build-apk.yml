name: Build Signed Release APK with Capacitor

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js v20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Web Game
      run: |
        npm install --legacy-peer-deps
        npm run build --if-present

    - name: Install Capacitor Packages
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android --save --legacy-peer-deps

    - name: Setup Capacitor Config & Sync
      run: |
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.simplerun.game",
          "appName": "Simple Run",
          "webDir": "dist"
        }
        EOF

        npx cap add android || true
        npx cap sync android

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Release Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        mkdir -p android/app
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks

    - name: Configure Gradle Signing
      run: |
        cd android
        grep -q "compileSdkVersion" app/build.gradle || grep -q "compileSdk " app/build.gradle || sed -i 's/android {/android {\n    compileSdkVersion 34/' app/build.gradle
        grep -q "signingConfigs {" app/build.gradle || sed -i 's/android {/android {\n    signingConfigs {\n        release {\n            storeFile file("release-key.jks")\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")\n        }\n    }/' app/build.gradle
        grep -q "signingConfig signingConfigs.release" app/build.gradle || sed -i 's/release {/release {\n            signingConfig signingConfigs.release/' app/build.gradle
        grep -q "org.jetbrains.kotlin" app/build.gradle || printf '\nconfigurations.all {\n    resolutionStrategy.eachDependency { details ->\n        if (details.requested.group == "org.jetbrains.kotlin") {\n            details.useVersion "1.8.22"\n        }\n    }\n}\n' >> app/build.gradle

    - name: Build Signed Release APK with Gradle
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean --no-daemon
        ./gradlew assembleRelease --no-daemon --refresh-dependencies

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Simple-Run-Release-APK
        path: android/app/build/outputs/apk/release/app-release.apk
        
